# Keep the examples the proxy is least sure about.  coreset.uncertainty.metric
# chooses between least_confidence, entropy and margin.
# CIFAR100, 10 images/class.

inherit: _base.yaml
name: uncertainty_cifar100_ipc10

data:
  dataset: CIFAR100
  ipc: 10

coreset:
  selector: uncertainty

output:
  save_path: runs/uncertainty_cifar100_ipc10
