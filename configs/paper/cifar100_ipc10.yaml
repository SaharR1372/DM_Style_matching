# The objective as written in the paper, for reproduction.
# CIFAR100, 10 images/class.  This is the protocol the reported number was measured with:
# 10000 iterations, 1 independent condensation run, 10 networks evaluated per run.

inherit: _base.yaml
name: paper_cifar100_ipc10

data:
  dataset: CIFAR100
  ipc: 10

condense:
  iterations: 10000
  num_exp: 1

eval:
  models: [ConvNet]
  num_eval: 10

output:
  save_path: runs/paper_cifar100_ipc10
