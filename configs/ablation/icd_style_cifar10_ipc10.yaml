# The style component of L_ICD instead of the content one: L_MMD + L_MM + L_CM
# + L_SD.  An alternative to configs/ours, not an addition to it -- the two
# components constrain the same second-order structure.
# CIFAR10, 10 images/class, on top of the released Style Matching settings.

inherit: ../ours/_base.yaml
name: icd_style_cifar10_ipc10

data:
  dataset: CIFAR10
  ipc: 10

condense:
  iterations: 20000
  num_exp: 3

loss:
  mm_ratio: 180.0
  cm_ratio: 10000.0
  icd:
    content_ratio: 0.0
    style_ratio: 150.0

eval:
  models: [ConvNet]
  num_eval: 10

output:
  save_path: runs/icd_style_cifar10_ipc10
