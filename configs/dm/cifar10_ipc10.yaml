# Plain distribution matching -- the baseline row of every table.
# CIFAR10, 10 images/class.  This is the protocol the reported number was measured with:
# 20000 iterations, 3 independent condensation run(s), 10 networks evaluated per run.

inherit: _base.yaml
name: dm_cifar10_ipc10

data:
  dataset: CIFAR10
  ipc: 10

condense:
  iterations: 20000
  num_exp: 3

eval:
  models: [ConvNet]
  num_eval: 10

output:
  save_path: runs/dm_cifar10_ipc10
